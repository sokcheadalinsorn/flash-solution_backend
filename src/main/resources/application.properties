# Application Name
spring.application.name=flash-solution-backend

# PostgreSQL Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lumiere_beauty_db}
spring.datasource.username=${DB_USERNAME:lumiere_beauty_user}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server Port
server.port=8080